name: Build iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    name: Build Navapp.ipa
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Make the Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Kite.xcodeproj \
            -scheme Kite \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 \
            || { grep -E "error:" build.log | sort -u | head -40; tail -n 30 build.log; exit 1; }
          tail -n 3 build.log
      - name: Stamp the build number
        run: |
          APP=build/Build/Products/Release-iphoneos/Navapp.app
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$APP/Info.plist"
          for x in "$APP"/PlugIns/*.appex; do
            [ -e "$x" ] || continue
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$x/Info.plist"
          done
      - name: Ad-hoc sign
        run: |
          APP=build/Build/Products/Release-iphoneos/Navapp.app
          if [ -d "$APP/Frameworks" ]; then
            for f in "$APP"/Frameworks/*.framework; do
              [ -e "$f" ] || continue
              codesign --force --sign - --timestamp=none "$f"
            done
          fi
          for x in "$APP"/PlugIns/*.appex; do
            [ -e "$x" ] || continue
            codesign --force --sign - --timestamp=none "$x"
          done
          codesign --force --sign - --timestamp=none "$APP"
      - name: Package .ipa
        run: |
          mkdir -p Payload
          ditto build/Build/Products/Release-iphoneos/Navapp.app Payload/Navapp.app
          zip -qr -X Navapp.ipa Payload
          unzip -tq Navapp.ipa
      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Navapp-${{ github.run_number }}
          path: Navapp.ipa
